function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
const QT=["standard","fillBlank","definition"];
function genQ(used){
  const pool=WORD_BANK.filter(w=>!used.has(w.word));
  const src=pool.length>0?pool:WORD_BANK;
  const e=src[Math.floor(Math.random()*src.length)];
  const wrong=MS[e.word]||[e.word.slice(0,3)+e.word.slice(4),e.word+"e"];
  const opts=shuffle([e.word,...wrong]);
  const type=QT[Math.floor(Math.random()*QT.length)];
  return{...e,options:opts,correctIndex:opts.indexOf(e.word),type};
}

const TOTAL=20;
let phase="start",qNum=0,score=0,q=null,sel=null,fb=false,used=new Set(),streak=0,best=0,hist=[];
const app=document.getElementById("app");

function render(){
  if(phase==="start") renderStart();
  else if(phase==="quiz") renderQuiz();
  else renderResult();
}

function renderStart(){
  app.style.cssText="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;";
  app.innerHTML=`
    <div style="text-align:center;max-width:400px;animation:fadeUp .5s ease-out">
      <div style="width:76px;height:76px;border-radius:20px;margin:0 auto 20px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:34px">✏️</div>
      <h1 style="font-size:34px;font-weight:800;letter-spacing:-.8px;margin-bottom:10px">Spell Check</h1>
      <p style="color:#888;font-size:17px;line-height:1.65;margin-bottom:32px;font-weight:400">${TOTAL} questions from the police officer exam word list. Definitions, fill-in-the-blank, and straight spelling.</p>
      <button class="btn-primary" style="width:auto;padding:16px 48px" onclick="startQuiz()">Begin</button>
    </div>`;
}

function startQuiz(){
  phase="quiz";qNum=0;score=0;streak=0;best=0;hist=[];used=new Set();
  q=genQ(used);used.add(q.word);sel=null;fb=false;
  render();
}

function renderQuiz(){
  app.style.cssText="";
  const ql=q.type==="fillBlank"?"Fill in the blank":q.type==="definition"?"Which word matches this definition?":"Select the correct spelling";

  let promptHTML="";
  if(q.type==="fillBlank"){
    const parts=q.sentence.split("___");
    promptHTML=`<p style="font-size:19px;font-weight:400;line-height:1.75;color:#333">${parts.join('<span class="blank-line">&nbsp;</span>')}</p>`;
  } else if(q.type==="definition"){
    promptHTML=`<p style="font-size:20px;font-weight:400;line-height:1.6;color:#333;font-style:italic">"${q.def}"</p>`;
  } else {
    promptHTML=`<p style="font-size:16px;font-weight:400;line-height:1.6;color:#999">${q.def}</p>`;
  }

  let optsHTML=q.options.map((o,i)=>{
    const ic=i===q.correctIndex, is_=i===sel;
    let bg="#fff",bd="1px solid #eee",cl="#1a1a1a",tbg="#f5f5f5",tc="#999",anim_="",cls="ob";
    if(fb){
      cls+=" locked";
      if(ic){bg="#f0fdf4";bd="2px solid #22c55e";cl="#166534";tbg="#22c55e";tc="#fff";anim_="animation:glow 1s ease;";}
      else if(is_){bg="#fef2f2";bd="2px solid #ef4444";cl="#991b1b";tbg="#ef4444";tc="#fff";anim_="animation:shake .35s ease;";}
      else{cl="#ccc";}
    }
    const tag=fb&&ic?"✓":fb&&is_?"✗":String.fromCharCode(65+i);
    return `<button class="${cls}" onclick="pick(${i})" style="background:${bg};border:${bd};border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:${fb?"default":"pointer"};animation:slideOpt .25s ease-out ${i*.05}s both;${anim_}">
      <span style="width:34px;height:34px;border-radius:10px;flex-shrink:0;background:${tbg};color:${tc};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600">${tag}</span>
      <span class="mono" style="font-size:19px;font-weight:500;color:${cl};letter-spacing:.6px">${o}</span>
    </button>`;
  }).join("");

  let feedbackHTML="";
  if(fb){
    let panels="";
    if(q.type!=="standard"){
      panels+=`<div class="card-sm"><span class="label-sm">Definition</span><p style="font-size:16px;color:#555;line-height:1.55">${q.def}</p></div>`;
    }
    if(q.type!=="fillBlank"){
      panels+=`<div class="card-sm"><span class="label-sm">Used in a sentence</span><p style="font-size:16px;color:#555;line-height:1.55">${q.sentence.replace("___",q.word)}</p></div>`;
    }
    const btnLabel=qNum+1>=TOTAL?"See Results":"Continue →";
    feedbackHTML=`<div style="margin-top:14px;animation:scaleIn .2s ease-out">${panels}<button class="btn-primary" onclick="nextQ()" style="margin-top:2px">${btnLabel}</button></div>`;
  }

  app.innerHTML=`
    <div style="animation:fadeUp .3s ease-out">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <span class="mono" style="font-size:14px;font-weight:500;color:#aaa">${qNum+1} / ${TOTAL}</span>
        <div style="display:flex;align-items:center;gap:12px">
          ${streak>=3?`<span style="font-size:14px;font-weight:600;color:#f59e0b">🔥 ${streak}</span>`:""}
          <span class="mono" style="font-size:14px;font-weight:600;background:#1a1a1a;color:#fff;border-radius:8px;padding:4px 12px">${score}</span>
        </div>
      </div>
      <div style="height:3px;background:#e5e5e5;border-radius:2px;margin-bottom:28px;overflow:hidden">
        <div style="width:${((qNum+1)/TOTAL)*100}%;height:100%;background:#1a1a1a;border-radius:2px;transition:width .4s ease"></div>
      </div>
      <div class="card">
        <span class="label">${ql}</span>
        ${promptHTML}
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">${optsHTML}</div>
      ${feedbackHTML}
    </div>`;
}

function pick(i){
  if(fb)return;
  sel=i;fb=true;
  const ok=i===q.correctIndex;
  if(ok){score++;streak++;if(streak>best)best=streak;}else{streak=0;}
  hist.push({word:q.word,correct:ok});
  render();
}

function nextQ(){
  if(qNum+1>=TOTAL){phase="result";render();return;}
  qNum++;q=genQ(used);used.add(q.word);sel=null;fb=false;
  render();
}

function renderResult(){
  app.style.cssText="";
  const pct=Math.round((score/TOTAL)*100);
  let grade;
  if(pct>=95)grade={l:"Outstanding",c:"#22c55e",e:"🏆"};
  else if(pct>=85)grade={l:"Excellent",c:"#3b82f6",e:"⭐"};
  else if(pct>=70)grade={l:"Good",c:"#eab308",e:"👍"};
  else if(pct>=50)grade={l:"Needs Work",c:"#f97316",e:"📝"};
  else grade={l:"Keep Practicing",c:"#ef4444",e:"💪"};

  const tags=hist.map(h=>`<span class="mono" style="font-size:14px;font-weight:500;padding:6px 12px;border-radius:8px;background:${h.correct?"#f0fdf4":"#fef2f2"};color:${h.correct?"#166534":"#991b1b"};border:1px solid ${h.correct?"#bbf7d0":"#fecaca"}">${h.word}</span>`).join("");

  app.innerHTML=`
    <div style="padding-top:24px;animation:fadeUp .4s ease-out">
      <div style="text-align:center;margin-bottom:32px">
        <div style="font-size:52px;margin-bottom:8px;animation:scaleIn .35s ease-out">${grade.e}</div>
        <h2 style="font-size:28px;font-weight:800;color:${grade.c};margin-bottom:4px">${grade.l}</h2>
        <p class="mono" style="font-size:40px;font-weight:600;color:#1a1a1a;margin:10px 0 4px">${score}/${TOTAL}</p>
        <p style="color:#aaa;font-size:16px">${pct}% · Best streak: ${best}</p>
      </div>
      <div style="background:#fff;border-radius:20px;padding:20px;margin-bottom:20px;border:1px solid #eee">
        <span class="mono" style="font-size:10px;font-weight:600;color:#bbb;text-transform:uppercase;letter-spacing:1.5px;display:block;margin-bottom:12px">Word Review</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px">${tags}</div>
      </div>
      <button class="btn-primary" onclick="startQuiz()">Try Again</button>
    </div>`;
}

render();
</script>
